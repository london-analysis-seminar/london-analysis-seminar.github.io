<body><strong> Amelie Loher </strong> (Oxford)   <br>

<em> Aleksandrov estimate in kinetic equations </em><br>
<br>
Abstract: <br>
We discuss Aleksandrov estimates for kinetic equations in non-divergence form with a rough diffusion coefficient. We present two different mechanisms, each of which has its advantages.
